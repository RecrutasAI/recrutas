name: Purge Old External Jobs

on:
  # schedule: moved to the Hetzner VPS crontab (infra/vps/crontab) on 2026-06-12.
  # Do NOT re-add a schedule here without removing it there first (double-runs).
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Keep jobs newer than this many days (default: 90)'
        required: false
        default: '90'
        type: string

concurrency:
  group: purge-old-jobs
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Delete stale external jobs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          RETAIN_DAYS="${{ github.event.inputs.retain_days || '90' }}"
          npx tsx scripts/purge-old-jobs.ts --retainDays=${RETAIN_DAYS}
