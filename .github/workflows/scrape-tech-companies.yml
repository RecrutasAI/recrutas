name: Scrape Tech Company Jobs

on:
  # schedule: moved to the Hetzner VPS crontab (infra/vps/crontab) on 2026-06-12.
  # Do NOT re-add a schedule here without removing it there first (double-runs).
  workflow_dispatch:  # Manual trigger

concurrency:
  group: scrape-tech-companies
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Tier 1 — Greenhouse companies (29)
        id: tier1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          USE_OLLAMA: false
          ENABLE_AI_EXTRACTION: false
        run: npx tsx scripts/scrape-tier.ts --tier=1 --timeout=900000

      - name: Scrape Tier 2 — Lever + Workday companies (22)
        id: tier2
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          USE_OLLAMA: false
          ENABLE_AI_EXTRACTION: false
        run: npx tsx scripts/scrape-tier.ts --tier=2 --timeout=600000

      - name: Scrape Tier 3 — Custom career pages (21)
        id: tier3
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          USE_OLLAMA: false
          ENABLE_AI_EXTRACTION: false
        run: npx tsx scripts/scrape-tier.ts --tier=3 --timeout=300000

      - name: Cleanup stale jobs (>15 days)
        id: cleanup
        continue-on-error: true  # Always attempt cleanup regardless of scrape results
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/scrape-tier.ts --cleanup --days=15

      - name: Report Status
        if: always()
        run: |
          echo "=== Scraping Results ==="
          echo "Tier 1 (Greenhouse): ${{ steps.tier1.outcome }}"
          echo "Tier 2 (Lever+Workday): ${{ steps.tier2.outcome }}"
          echo "Tier 3 (Custom): ${{ steps.tier3.outcome }}"
          echo "Cleanup: ${{ steps.cleanup.outcome }}"
          echo "======================="
          if [[ "${{ steps.tier1.outcome }}" == "failure" && "${{ steps.tier2.outcome }}" == "failure" && "${{ steps.tier3.outcome }}" == "failure" ]]; then
            echo "::error::All scrape tiers failed!"
            exit 1
          fi
