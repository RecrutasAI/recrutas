name: Retry Failed Resume Parses

on:
  # schedule: moved to the Hetzner VPS crontab (infra/vps/crontab) on 2026-06-12.
  # Do NOT re-add a schedule here without removing it there first (double-runs).
  workflow_dispatch:

concurrency:
  group: retry-failed-parses
  cancel-in-progress: true

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Retry failed resume parses
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/retry-failed-parses.ts
