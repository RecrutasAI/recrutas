name: Scrape ATS Jobs

on:
  # schedule: moved to the Hetzner VPS crontab (infra/vps/crontab) on 2026-06-12.
  # Do NOT re-add a schedule here without removing it there first (double-runs).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        type: boolean
        default: false

concurrency:
  group: scrape-ats-company
  cancel-in-progress: true

jobs:
  scrape-ats:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Scrape ATS job listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.DIRECT_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          npx tsx scripts/scrape-all-company-jobs.ts $ARGS