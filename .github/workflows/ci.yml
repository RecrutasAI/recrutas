name: CI/CD Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22.x'

jobs:
  # Phase 1: Static Analysis
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips the flaky `supabase` CLI binary download
        # (postinstall fetches from GitHub releases and intermittently fails with
        # "incorrect header check"). The CLI isn't needed for CI; esbuild resolves
        # its binary from the @esbuild/* optional dep, not a postinstall.
        run: npm ci --ignore-scripts

      - name: Run TypeScript type check
        run: npm run type-check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  lint:
    name: ESLint Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips the flaky `supabase` CLI binary download
        # (postinstall fetches from GitHub releases and intermittently fails with
        # "incorrect header check"). The CLI isn't needed for CI; esbuild resolves
        # its binary from the @esbuild/* optional dep, not a postinstall.
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  # Phase 2: Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        # --ignore-scripts skips the flaky `supabase` CLI binary download
        # (postinstall fetches from GitHub releases and intermittently fails with
        # "incorrect header check"). The CLI isn't needed for CI; esbuild resolves
        # its binary from the @esbuild/* optional dep, not a postinstall.
        run: npm ci --ignore-scripts
      
      - name: Run unit tests
        run: npm run test:unit:backend
        env:
          NODE_ENV: test
          # No GROQ_API_KEY — unit tests must not call external AI APIs

      # The regression guards (résumé role extraction, flattened PDFs, parse
      # provenance, ingestion salvage, extension file guard) live here. They
      # were covered by no CI step, which is how the role-extraction guard
      # stopped running unnoticed.
      - name: Run server tests
        run: npm run test:server
        env:
          NODE_ENV: test

      - name: Run frontend tests
        run: npx vitest run
        env:
          NODE_ENV: test
          # supabase-client.ts calls createClient() at import time and throws on
          # an empty URL. The tests mock every request, so placeholders suffice.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key


  # Phase 3: Build
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [type-check, unit-tests]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        # --ignore-scripts skips the flaky `supabase` CLI binary download
        # (postinstall fetches from GitHub releases and intermittently fails with
        # "incorrect header check"). The CLI isn't needed for CI; esbuild resolves
        # its binary from the @esbuild/* optional dep, not a postinstall.
        run: npm ci --ignore-scripts
      
      - name: Build project
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # Phase 4: Security Scan (blocks on high/critical advisories)
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        # --ignore-scripts skips the flaky `supabase` CLI binary download
        # (postinstall fetches from GitHub releases and intermittently fails with
        # "incorrect header check"). The CLI isn't needed for CI; esbuild resolves
        # its binary from the @esbuild/* optional dep, not a postinstall.
        run: npm ci --ignore-scripts
      
      - name: Run security audit
        run: npm audit --audit-level=high

  # Quality Gate Summary
  quality-gate:
    name: Quality Gate Status
    runs-on: ubuntu-latest
    needs: [type-check, unit-tests, build, security-scan]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FAILED=0
          
          if [ "${{ needs.type-check.result }}" != "success" ]; then
            echo "❌ Type Check: FAILED" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Type Check: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "❌ Unit Tests: FAILED" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Unit Tests: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ Security Audit: FAILED" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Security Audit: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ Build: FAILED" >> $GITHUB_STEP_SUMMARY
            FAILED=1
          else
            echo "✅ Build: PASSED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ $FAILED -eq 1 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Quality gate blocked - Please fix failing jobs before merging" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🎉 All quality gates passed!" >> $GITHUB_STEP_SUMMARY
          fi
