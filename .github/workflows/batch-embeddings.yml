name: Batch Embeddings

on:
  # schedule: moved to the Hetzner VPS crontab (infra/vps/crontab) on 2026-06-12.
  # Do NOT re-add a schedule here without removing it there first (double-runs).
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of jobs to process'
        required: false
        default: '500'
        type: string
      force:
        description: 'Force refresh all embeddings'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: batch-embeddings
  cancel-in-progress: true

jobs:
  compute-embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute batch embeddings
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LIMIT=${{ github.event.inputs.limit }}
            FORCE=${{ github.event.inputs.force }}
          else
            LIMIT=5000
            FORCE=false
          fi

          if [ "$FORCE" = "true" ]; then
            BATCH_LIMIT=$LIMIT npx tsx server/services/batch-embedding.service.ts --force
          else
            BATCH_LIMIT=$LIMIT npx tsx server/services/batch-embedding.service.ts
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}

      - name: Report results
        if: always()
        run: |
          echo "Batch embedding computation completed"
          echo "Check logs above for details"
